[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endless-war-simulator"
version = "0.1.0"
description = "Persistent autonomous war simulation for Ubuntu MATE"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: runs many simulated years; about 6 seconds, not milliseconds"]

[tool.setuptools.package-data]
"endless_war.ui" = ["assets/*.png", "assets/*.md", "assets/structures/*.png", "assets/units/*.png"]
