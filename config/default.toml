[simulation]
tick_hours = 6
live_tick_seconds = 1.0
max_offline_days_per_startup = 365
# How many ticks the service may run in one wake-up. Caps catch-up after a
# laptop sleep or a stalled reader so the world does not simulate a week at once.
max_catchup_ticks_per_wake = 8

[world]
default_factions = 5
default_provinces = 96
grid_cols = 12

[balance]
base_recruitment_rate = 0.001
base_supply_decay_per_hop = 0.08
mobilization_ceiling = 0.08
income_per_industry = 100.0
upkeep_per_manpower = 0.002
base_casualty_rate = 0.02
organization_recovery_per_tick = 0.02
morale_recovery_per_tick = 0.015
attacker_break_organization = 0.25
defender_break_organization = 0.20
exhaustion_per_casualty_fraction = 1.5
exhaustion_decay_per_tick = 0.0008
war_declaration_strength_ratio = 1.35
war_declaration_max_exhaustion = 0.45
peace_exhaustion_threshold = 0.75
peace_stalemate_ticks = 480
min_supply = 0.05
# Thresholds the AI and the systems read. Moved out of code so the next phase
# can tune them without touching a system (CLAUDE.md: balancing numbers live here).
broken_organization = 0.30
broken_morale = 0.25
attack_strength_ratio = 1.2
min_advance_organization = 0.15
# Ticks an army must hold an undefended hostile province, alone and
# uninterrupted, before control changes. Stops capture churn (armies trading
# an empty province every other tick). 4 ticks = one simulated day.
occupation_ticks = 4
# Garrisons (docs/superpowers/specs/2026-09-24-war-model-redesign.md): every
# province defends itself with population x per-capita x terrain strength, in
# effective-power units; an occupier's garrison is a fraction of that.
garrison_per_capita = 0.01
garrison_regen_per_tick = 0.01
occupied_garrison_factor = 0.3
garrison_loss_multiplier = 8.0
# Wars end: exhaustion also grows with time at war; a side that has lost its
# capital and most of its pre-war land capitulates.
war_weariness_per_tick = 0.0004
capitulation_land_fraction = 0.5
max_concurrent_wars = 2
# Reinforcement (closes the ledgered "reinforcement gap"): a share of the
# reserve pool flows each tick into armies on supplied own land, and a faction
# below `min_field_armies` raises a fresh army from its reserves.
reinforcement_rate_per_tick = 0.002
min_field_armies = 3
new_army_share = 0.10
# A garrison below this share of its cap no longer holds (sieges took ~150
# ticks at 1 %). Reserves count for this much in war-declaration strength.
garrison_broken_share = 0.10
reserve_strength_weight = 0.25
# A new army needs at least this many men, and starts as fresh conscripts.
min_new_army = 5000
new_army_equipment = 0.7
new_army_morale = 0.7
new_army_organization = 0.8
new_army_training = 0.5
low_supply_threshold = 0.35
significant_battle_losses = 2000

# Defensive multiplier applied to the defender's power, by terrain.
# Keep this table LAST in [balance]: TOML assigns any key after a sub-table
# header to that sub-table.
[balance.terrain_defence]
plains = 1.00
forest = 1.20
hills = 1.35
mountain = 1.60
urban = 1.45
